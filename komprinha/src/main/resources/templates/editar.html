<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
</head>
<body>
    <h1>Editar Produto</h1>
    <form th:action="@{'/produtos/editar/' + ${produto.id}}" th:object="${produto}" method="post">
        <label>Nome:</label>
        <input type="text" th:field="*{nome}" /><br/><br/>
        <label>Descrição:</label>
        <input type="text" th:field="*{descricao}" /><br/><br/>
        <label>Preço:</label>
        <input type="number" step="0.01" th:field="*{preco}" /><br/><br/>
        <label>Estoque:</label>
        <input type="number" th:field="*{estoque}" /><br/><br/>
        <button type="submit">Atualizar</button>
    </form>
    <br/>
    <a href="/produtos">Voltar à lista</a>
</body>
</html>
