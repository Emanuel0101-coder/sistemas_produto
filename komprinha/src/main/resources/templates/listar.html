<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Produtos</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <header>Komprinha</header>

  <div class="container">
    <h2>Produtos Cadastrados</h2>

    <a class="btn" th:href="@{/produtos/novo}">➕ Novo Produto</a>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Preço</th>
          <th>Descrição</th>
          <th>Estoque</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="produto : ${produtos}">
          <td th:text="${produto.nome}"></td>
          <td>R$ <span th:text="${#numbers.formatDecimal(produto.preco, 1, 2)}"></span></td>
          <td th:text="${produto.descricao}"></td>
          <td th:text="${produto.estoque}"></td>
          <td>
            <a class="btn btn-visualizar" th:href="@{|/produtos/visualizar/${produto.id}|}">visualizar</a>
            <a class="btn btn-editar" th:href="@{|/produtos/editar/${produto.id}|}">Editar</a>
            <a class="btn btn-excluir" th:href="@{|/produtos/deletar/${produto.id}|}">Excluir</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
