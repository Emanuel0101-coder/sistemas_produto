<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Cadastrar Produto</title></head>
<body>
<h1>Cadastrar Produto</h1>
<form th:action="@{/produtos}" th:object="${produto}" method="post">
    Nome: <input type="text" th:field="*{nome}" /><br/>
    Descrição: <input type="text" th:field="*{descricao}" /><br/>
    Preço: <input type="number" step="0.01" th:field="*{preco}" /><br/>
    Estoque: <input type="number" th:field="*{estoque}" /><br/>
    <button type="submit">Salvar</button>
</form>
<a href="/produtos">Voltar</a>
</body>
</html>
