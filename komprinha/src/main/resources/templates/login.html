<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komprinha - Login</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .logo {
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .logo img {
      width: 90%;
      height: auto;
    }

    h1 {
      font-size: 2rem;
      color: #222;
      margin: 10px 0 0;
      font-weight: 700;
    }

    p {
      color: #666;
      margin: 4px 0 25px;
      font-size: 1rem;
    }

    h2 {
      color: #111;
      font-size: 1.2rem;
      margin-bottom: 25px;
    }

    .btn {
      background: #1E40FF;
      color: white;
      padding: 14px 80px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .btn:hover {
      background: #0035d1;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 10px;
      color: #999;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/images/logo2.png" alt="Logo Komprinha">
  </div>

  <h1>Komprinha</h1>
  <p>Carrinho cheio</p>

  <h2>Olá</h2>

  <a href="/produtos" class="btn">Entrar</a>

  <footer>© 2025 Komprinha - Muito mais que um mercado.</footer>
</body>
</html>
